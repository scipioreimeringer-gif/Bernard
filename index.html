<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bernards Woordkist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7F0; --surface:#FFFFFF; --surface2:#FBEEE4; --border:#F0DFD1;
    --text:#262A3D; --muted:#6C7090;
    --navy:#1E2761; --navy2:#313E82;
    --coral:#F0624F; --coralD:#D14A3D;
    --gold:#F0A63A; --green:#2E9E6B; --red:#D2483D;
    --shadow: 0 10px 28px -14px rgba(30,39,97,.28);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14172A; --surface:#1D2040; --surface2:#242849; --border:#34386B;
      --text:#EEF0FB; --muted:#9BA0C7;
      --coral:#FF7A68; --coralD:#FF9184; --gold:#FFC069; --green:#3FCB92; --red:#FF8A7D;
      --shadow: 0 10px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14172A; --surface:#1D2040; --surface2:#242849; --border:#34386B;
    --text:#EEF0FB; --muted:#9BA0C7;
    --coral:#FF7A68; --coralD:#FF9184; --gold:#FFC069; --green:#3FCB92; --red:#FF8A7D;
    --shadow: 0 10px 28px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;}
  h1,h2,h3,.disp{font-family:'Fredoka',system-ui,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding-inline:20px;}

  header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;}
  header.bar .inner{max-width:760px;margin:0 auto;padding:16px 20px;}
  header.bar h1{margin:0 0 2px;font-size:1.5rem;letter-spacing:.2px;}
  header.bar p{margin:0;color:#C6CBEC;font-size:.88rem;}

  nav.tabs{display:flex;gap:8px;max-width:760px;margin:14px auto 0;padding-inline:20px;}
  nav.tabs button{flex:1;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;
    background:var(--surface);color:var(--muted);border:2px solid var(--border);border-radius:14px;
    padding:11px 10px;cursor:pointer;transition:.15s;}
  nav.tabs button.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  nav.tabs button:hover:not(.active){border-color:var(--coral);color:var(--coralD);}

  main{padding-block:22px 48px;}
  [hidden]{display:none!important;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);}
  .panel + .panel{margin-top:16px;}

  /* ---- Flashcards ---- */
  .fc-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .fc-controls select{font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--border);}
  .seg button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.85rem;border:none;background:none;
    color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;}
  .seg button.active{background:var(--coral);color:#fff;}

  .card-stage{perspective:1400px;height:250px;margin:6px 0 18px;}
  .flipcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);cursor:pointer;}
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;}
  .face.front{background:var(--surface2);border:1px solid var(--border);}
  .face.back{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;transform:rotateY(180deg);}
  .face .tag{font-size:.72rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--coralD);margin-bottom:10px;}
  .face.back .tag{color:var(--gold);}
  .face .word{font-family:'Fredoka',sans-serif;font-size:1.9rem;font-weight:600;line-height:1.2;text-wrap:balance;}
  .face .note{margin-top:10px;font-size:.85rem;color:var(--muted);font-style:italic;}
  .face.back .note{color:#C6CBEC;}
  .face .hint{position:absolute;bottom:14px;font-size:.75rem;color:var(--muted);}
  .face.back .hint{color:#9AA2D6;}

  .fc-nav{display:flex;align-items:center;justify-content:center;gap:14px;}
  .fc-nav button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.3rem;width:46px;height:46px;
    border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--navy);cursor:pointer;}
  :root[data-theme="dark"] .fc-nav button, @media (prefers-color-scheme:dark){.fc-nav button{color:var(--text);}}
  .fc-nav button:hover{background:var(--coral);color:#fff;border-color:var(--coral);}
  .fc-count{font-weight:700;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
  .fc-shuffle{margin-left:auto;}

  /* ---- Toets ---- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:700;font-size:.85rem;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px;}
  .field .seg{width:100%;}
  .field .seg button{flex:1;}
  .field select{width:100%;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;}
  .btn-primary{width:100%;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;color:#fff;
    background:var(--coral);border:none;border-radius:14px;padding:14px;cursor:pointer;margin-top:6px;}
  .btn-primary:hover{background:var(--coralD);}
  .btn-secondary{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;color:var(--navy);
    background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 16px;cursor:pointer;}
  :root[data-theme="dark"] .btn-secondary{color:var(--text);}
  @media (prefers-color-scheme:dark){.btn-secondary{color:var(--text);}}
  .btn-secondary:hover{border-color:var(--coral);color:var(--coralD);}

  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .progress-wrap{flex:1;margin-right:14px;}
  .progress-track{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--coral);border-radius:6px;transition:width .3s;}
  .progress-label{font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:700;}
  .score-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;
    font-weight:700;font-size:.85rem;color:var(--navy);white-space:nowrap;}
  :root[data-theme="dark"] .score-pill{color:var(--text);}
  @media (prefers-color-scheme:dark){.score-pill{color:var(--text);}}

  .q-word{font-family:'Fredoka',sans-serif;font-size:2rem;font-weight:600;text-align:center;margin:14px 0 24px;text-wrap:balance;}
  .options{display:grid;gap:10px;}
  .opt{font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;text-align:left;color:var(--text);
    background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--coral);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:color-mix(in srgb, var(--green) 20%, var(--surface2));border-color:var(--green);color:var(--green);}
  .opt.wrong{background:color-mix(in srgb, var(--red) 18%, var(--surface2));border-color:var(--red);color:var(--red);}

  .type-row{display:flex;gap:10px;}
  .type-row input{flex:1;font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;color:var(--text);
    background:var(--surface2);border:2px solid var(--border);border-radius:12px;padding:13px 16px;}
  .type-row input:focus{outline:none;border-color:var(--coral);}
  .type-row button{font-family:'Fredoka',sans-serif;font-weight:600;background:var(--coral);color:#fff;
    border:none;border-radius:12px;padding:0 20px;cursor:pointer;}

  .feedback{margin-top:14px;border-radius:12px;padding:13px 16px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .feedback.ok{background:color-mix(in srgb, var(--green) 16%, transparent);color:var(--green);}
  .feedback.bad{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red);}
  .feedback .sub{font-weight:400;color:var(--muted);}

  .next-wrap{margin-top:16px;text-align:right;}
  .quiz-bottom{margin-top:18px;text-align:center;}
  .quiz-bottom a{color:var(--muted);font-size:.85rem;cursor:pointer;text-decoration:underline;}

  .result-score{text-align:center;padding:10px 0 20px;}
  .result-score .big{font-family:'Fredoka',sans-serif;font-size:3.2rem;font-weight:600;color:var(--coral);}
  .result-score .lbl{color:var(--muted);font-weight:700;}
  .review-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:.92rem;}
  .review-item:last-child{border-bottom:none;}
  .review-item .rw{color:var(--red);font-weight:700;}
  .review-item .rc{color:var(--green);font-weight:700;}
  .result-actions{display:flex;gap:10px;margin-top:18px;}
  .result-actions button{flex:1;}

  footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 0 30px;}
</style>
</head>
<body>
<header class="bar">
  <div class="inner">
    <h1>🗝️ Bernards Woordkist</h1>
    <p>Alle woordenschat tot nu toe · flashcards & toetsen</p>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="flash">🃏 Flashcards</button>
  <button class="tab-btn" data-tab="toets">📝 Toets</button>
</nav>

<main class="wrap">

  <!-- FLASHCARDS -->
  <section id="tab-flash">
    <div class="panel">
      <div class="fc-controls">
        <select id="fc-deck"></select>
        <div class="seg" id="fc-dir">
          <button data-dir="nl-en" class="active">NL → EN</button>
          <button data-dir="en-nl">EN → NL</button>
        </div>
        <button class="btn-secondary fc-shuffle" id="fc-shuffle">🔀 Shuffle</button>
      </div>

      <div class="card-stage">
        <div class="flipcard" id="flipcard">
          <div class="face front">
            <div class="tag" id="fc-front-tag">deck</div>
            <div class="word" id="fc-front-word">woord</div>
            <div class="note" id="fc-front-note"></div>
            <div class="hint">tik om te draaien</div>
          </div>
          <div class="face back">
            <div class="tag">vertaling</div>
            <div class="word" id="fc-back-word">translation</div>
            <div class="hint">tik om terug te draaien</div>
          </div>
        </div>
      </div>

      <div class="fc-nav">
        <button id="fc-prev">‹</button>
        <span class="fc-count" id="fc-count">1 / 1</span>
        <button id="fc-next">›</button>
      </div>
    </div>
  </section>

  <!-- TOETS -->
  <section id="tab-toets" hidden>

    <div class="panel" id="quiz-settings">
      <h2 style="margin-top:0;">Toets instellen</h2>

      <div class="field">
        <label>Richting</label>
        <div class="seg" id="q-dir">
          <button data-dir="nl-en" class="active">Nederlands → Engels</button>
          <button data-dir="en-nl">Engels → Nederlands</button>
        </div>
      </div>

      <div class="field">
        <label>Soort vragen</label>
        <div class="seg" id="q-type">
          <button data-type="mc" class="active">Meerkeuze</button>
          <button data-type="typed">Zelf typen</button>
        </div>
      </div>

      <div class="field">
        <label>Categorie</label>
        <select id="q-deck"></select>
      </div>

      <div class="field">
        <label>Aantal vragen</label>
        <select id="q-count">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="all">Alle woorden</option>
        </select>
      </div>

      <button class="btn-primary" id="q-start">Start toets</button>
    </div>

    <div class="panel" id="quiz-running" hidden>
      <div class="quiz-top">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="q-progress-fill" style="width:0%"></div></div>
          <div class="progress-label" id="q-progress-label">Vraag 1 van 10</div>
        </div>
        <div class="score-pill" id="q-score">✓ 0</div>
      </div>

      <div class="q-word" id="q-word">woord</div>

      <div class="options" id="q-options"></div>

      <div class="type-row" id="q-typerow" hidden>
        <input type="text" id="q-typeinput" placeholder="Typ je antwoord..." autocomplete="off">
        <button id="q-typecheck">Controleer</button>
      </div>

      <div id="q-feedback"></div>

      <div class="next-wrap" id="q-nextwrap" hidden>
        <button class="btn-primary" id="q-next" style="width:auto;padding:12px 28px;">Volgende →</button>
      </div>

      <div class="quiz-bottom"><a id="q-stop">Stoppen en instellingen aanpassen</a></div>
    </div>

    <div class="panel" id="quiz-results" hidden>
      <div class="result-score">
        <div class="big" id="r-score">0/0</div>
        <div class="lbl" id="r-label">goed beantwoord</div>
      </div>
      <div id="r-review"></div>
      <div class="result-actions">
        <button class="btn-secondary" id="r-retry">🔁 Opnieuw</button>
        <button class="btn-primary" id="r-newsettings" style="margin-top:0;">Nieuwe toets</button>
      </div>
    </div>

  </section>

</main>

<footer>Gemaakt voor Bernard · Nederlands A1–A2</footer>

function deckLabel(id){ const d=DECKS.find(d=>d.id===id); return d?d.label:id; }
function primary(v){ return Array.isArray(v)?v[0]:v; }

    document.getElementById('tab-toets').hidden = btn.dataset.tab!=='toets';

/* ============ DECK SELECTS ============ */
function fillDeckSelect(sel, withAll){
  sel.innerHTML='';
  if(withAll){ const o=document.createElement('option'); o.value='all'; o.textContent='Alle woorden ('+VOCAB.length+')'; sel.appendChild(o); }
  DECKS.forEach(d=>{
    const o=document.createElement('option'); o.value=d.id;
    o.textContent=d.label+' ('+VOCAB.filter(v=>v.deck===d.id).length+')';
    sel.appendChild(o);
  });
}
fillDeckSelect(document.getElementById('fc-deck'), true);
fillDeckSelect(document.getElementById('q-deck'), true);

/* ============ FLASHCARDS ============ */
const fcState = { deck:'all', dir:'nl-en', pool:[], idx:0, flipped:false };

function fcBuildPool(){
  fcState.pool = fcState.deck==='all' ? VOCAB.slice() : VOCAB.filter(v=>v.deck===fcState.deck);
  fcState.idx = 0; fcState.flipped=false;
  document.getElementById('flipcard').classList.remove('flipped');
}
function fcShuffle(){
  for(let i=fcState.pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fcState.pool[i],fcState.pool[j]]=[fcState.pool[j],fcState.pool[i]]; }
  fcState.idx=0; fcState.flipped=false;
  document.getElementById('flipcard').classList.remove('flipped');
  fcRender();
}
function fcRender(){
  const v = fcState.pool[fcState.idx];
  if(!v) return;
  const frontIsNl = fcState.dir==='nl-en';
  document.getElementById('fc-front-tag').textContent = deckLabel(v.deck) + (frontIsNl ? ' · NL' : ' · EN');
  document.getElementById('fc-front-word').textContent = frontIsNl ? v.nl : primary(v.en);
  document.getElementById('fc-front-note').textContent = frontIsNl ? (v.note||'') : '';
  document.getElementById('fc-back-word').textContent = frontIsNl ? primary(v.en) : v.nl;
  document.getElementById('fc-count').textContent = (fcState.idx+1)+' / '+fcState.pool.length;
}
document.getElementById('flipcard').addEventListener('click',()=>{
  fcState.flipped=!fcState.flipped;
  document.getElementById('flipcard').classList.toggle('flipped', fcState.flipped);
});
document.getElementById('fc-prev').addEventListener('click',()=>{
  fcState.idx = (fcState.idx-1+fcState.pool.length)%fcState.pool.length;
  fcState.flipped=false; document.getElementById('flipcard').classList.remove('flipped'); fcRender();
});
document.getElementById('fc-next').addEventListener('click',()=>{
  fcState.idx = (fcState.idx+1)%fcState.pool.length;
  fcState.flipped=false; document.getElementById('flipcard').classList.remove('flipped'); fcRender();
});
document.getElementById('fc-deck').addEventListener('change',e=>{ fcState.deck=e.target.value; fcBuildPool(); fcRender(); });
document.getElementById('fc-shuffle').addEventListener('click', fcShuffle);
document.querySelectorAll('#fc-dir button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#fc-dir button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    fcState.dir = btn.dataset.dir;
    fcState.flipped=false; document.getElementById('flipcard').classList.remove('flipped');
    fcRender();
  });
});
fcBuildPool(); fcRender();

const qSettings = { dir:'nl-en', type:'mc', deck:'all', count:20 };
document.querySelectorAll('#q-dir button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#q-dir button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); qSettings.dir=btn.dataset.dir;
  });
});
document.querySelectorAll('#q-type button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#q-type button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); qSettings.type=btn.dataset.type;
  });
});

function normalize(str){
  return String(str).toLowerCase().trim()
    .replace(/^(de |het |to |the |an |a )/,'')
    .replace(/[^\w\s]/g,'')
    .replace(/\s+/g,' ').trim();
}
function isCorrect(userInput, correctAnswer){
  const answers = Array.isArray(correctAnswer)?correctAnswer:[correctAnswer];
  const nu = normalize(userInput);
  return answers.some(a=>normalize(a)===nu);
}

let quiz = null;

document.getElementById('q-start').addEventListener('click',()=>{
  qSettings.deck = document.getElementById('q-deck').value;
  qSettings.count = document.getElementById('q-count').value;

  let pool = qSettings.deck==='all' ? VOCAB.slice() : VOCAB.filter(v=>v.deck===qSettings.deck);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const n = qSettings.count==='all' ? pool.length : Math.min(parseInt(qSettings.count,10), pool.length);
  pool = pool.slice(0,n);

  quiz = { items:pool, i:0, score:0, wrong:[], answered:false };
  document.getElementById('quiz-settings').hidden = true;
  document.getElementById('quiz-results').hidden = true;
  document.getElementById('quiz-running').hidden = false;
  renderQuestion();
});

function currentAskWord(v){ return qSettings.dir==='nl-en' ? v.nl : primary(v.en); }
function currentAnswer(v){ return qSettings.dir==='nl-en' ? v.en : v.nl; }

function renderQuestion(){
  const v = quiz.items[quiz.i];
  quiz.answered = false;
  document.getElementById('q-progress-fill').style.width = ((quiz.i)/quiz.items.length*100)+'%';
  document.getElementById('q-progress-label').textContent = 'Vraag '+(quiz.i+1)+' van '+quiz.items.length;
  document.getElementById('q-score').textContent = '✓ '+quiz.score;
  document.getElementById('q-word').textContent = currentAskWord(v);
  document.getElementById('q-feedback').innerHTML='';
  document.getElementById('q-nextwrap').hidden = true;

  const optionsBox = document.getElementById('q-options');
  const typeRow = document.getElementById('q-typerow');
  optionsBox.innerHTML=''; optionsBox.hidden = qSettings.type!=='mc';
  typeRow.hidden = qSettings.type!=='typed';

  if(qSettings.type==='mc'){
    const correctText = primary(currentAnswer(v));
    const otherPool = VOCAB.filter(x=>x!==v);
    const distractors = [];
    const used = new Set([normalize(correctText)]);
    for(let i=otherPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [otherPool[i],otherPool[j]]=[otherPool[j],otherPool[i]]; }
    for(const x of otherPool){
      const txt = primary(qSettings.dir==='nl-en' ? x.en : x.nl);
      if(!used.has(normalize(txt))){ distractors.push(txt); used.add(normalize(txt)); }
      if(distractors.length>=3) break;
    }
    const options = [correctText, ...distractors];
    for(let i=options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }

    options.forEach(optText=>{
      const b = document.createElement('button');
      b.className='opt'; b.textContent = optText;
      b.addEventListener('click',()=>{
        if(quiz.answered) return;
        quiz.answered = true;
        const ok = normalize(optText)===normalize(correctText);
        document.querySelectorAll('.opt').forEach(o=>{
          o.disabled = true;
          if(normalize(o.textContent)===normalize(correctText)) o.classList.add('correct');
          else if(o===b && !ok) o.classList.add('wrong');
        });
        finishAnswer(ok, correctText);
      });
      optionsBox.appendChild(b);
    });
  } else {
    const input = document.getElementById('q-typeinput');
    input.value=''; input.disabled=false; input.focus();
    const check = ()=>{
      if(quiz.answered) return;
      quiz.answered = true;
      input.disabled = true;
      const correctText = primary(currentAnswer(v));
      const ok = isCorrect(input.value, currentAnswer(v));
      finishAnswer(ok, correctText);
    };
    document.getElementById('q-typecheck').onclick = check;
    input.onkeydown = (e)=>{ if(e.key==='Enter') check(); };
  }
}

function finishAnswer(ok, correctText){
  if(ok) quiz.score++;
  else quiz.wrong.push({ q: document.getElementById('q-word').textContent, correct: correctText });
  const fb = document.getElementById('q-feedback');
  fb.innerHTML = '<div class="feedback '+(ok?'ok':'bad')+'">'+
    (ok ? '✓ Goed zo!' : '✗ Helaas — juiste antwoord: <span class="sub">'+correctText+'</span>') +
    '</div>';
  document.getElementById('q-score').textContent = '✓ '+quiz.score;
  document.getElementById('q-nextwrap').hidden = false;
}

document.getElementById('q-next').addEventListener('click',()=>{
  quiz.i++;
  if(quiz.i>=quiz.items.length){ showResults(); }
  else { renderQuestion(); }
});

document.getElementById('q-stop').addEventListener('click',()=>{
  document.getElementById('quiz-running').hidden = true;
  document.getElementById('quiz-settings').hidden = false;
});

function showResults(){
  document.getElementById('quiz-running').hidden = true;
  document.getElementById('quiz-results').hidden = false;
  document.getElementById('r-score').textContent = quiz.score+'/'+quiz.items.length;
  const pct = Math.round(quiz.score/quiz.items.length*100);
  document.getElementById('r-label').textContent = pct+'% goed beantwoord';
  const rev = document.getElementById('r-review');
  if(quiz.wrong.length===0){
    rev.innerHTML = '<p style="text-align:center;color:var(--green);font-weight:700;">Alles goed! 🎉</p>';
  } else {
    rev.innerHTML = '<h3 style="margin-bottom:6px;">Nog even oefenen:</h3>' + quiz.wrong.map(w=>
      '<div class="review-item"><span>'+w.q+'</span><span class="rc">'+w.correct+'</span></div>'
    ).join('');
  }
}
document.getElementById('r-retry').addEventListener('click',()=>{
  quiz.items.sort(()=>Math.random()-0.5);
  quiz.i=0; quiz.score=0; quiz.wrong=[];
  document.getElementById('quiz-results').hidden = true;
  document.getElementById('quiz-running').hidden = false;
  renderQuestion();
});
document.getElementById('r-newsettings').addEventListener('click',()=>{
  document.getElementById('quiz-results').hidden = true;
  document.getElementById('quiz-settings').hidden = false;
});
</script>
